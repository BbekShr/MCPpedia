name: Blog Security Alerts

on:
  schedule:
    - cron: '30 9 * * *'  # Daily 9:30am UTC / 4:30am CST (after score computation)
  workflow_dispatch:

# Serialize every workflow that pushes to main so their push windows don't
# overlap. Combined with the rebase-retry push below, this eliminates the
# non-fast-forward rejections that emailed spurious "workflow failed" notices.
concurrency:
  group: content-push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Publish a post only when there is a new critical/high advisory that
      # .meta.json has not already covered — the bot writes nothing otherwise,
      # and the commit step below no-ops. Rendered from Supabase data; see the
      # note in generate-blog.yml for why there is no model call here any more.
      - name: Render security alert from advisory data
        run: npx tsx bots/generate-blog.ts --security-only --render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push if new alerts
        run: |
          git config user.name "mcppedia-bot"
          git config user.email "bot@mcppedia.org"
          # Regenerate the frontmatter index in the same commit — request-time
          # routes read data/blog-index.json, not content/, so a post committed
          # without it is invisible to /blog, /sitemap.xml and /llms.txt. The
          # previous version of this job omitted this and only generate-blog.yml
          # ever caught the index up.
          node scripts/generate-content-index.mjs
          git add content/blog/ data/blog-index.json
          git diff --cached --quiet && echo "No security alerts to publish" && exit 0
          git commit -m "blog: security alert [bot]"
          # Rebase-retry: other bot workflows push to main too, so a push can be
          # rejected (non-fast-forward) if main moved since checkout. Rebase onto
          # the latest and retry instead of failing the job — the old plain
          # `git push` emailed a spurious failure even when the content was fine.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "Push still failing after 5 attempts"
          exit 1
