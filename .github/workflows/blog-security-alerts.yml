name: Blog Security Alerts

on:
  schedule:
    - cron: '30 9 * * *'  # Daily 9:30am UTC / 4:30am CST (after score computation)
  workflow_dispatch:

# Serialize every workflow that pushes to main so their push windows don't
# overlap. Combined with the rebase-retry push below, this eliminates the
# non-fast-forward rejections that emailed spurious "workflow failed" notices.
concurrency:
  group: content-push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # 1) Decide whether there's a new critical/high advisory worth publishing.
      #    Supabase only — no model call. Emits a prompt file (job 0) when there
      #    is something to write. Sets job_count + model_0.
      - name: Prepare security alert job
        id: prep
        run: npx tsx bots/generate-blog.ts --security-only --prepare
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 2) Write it with the Claude Code action, billed to a Claude subscription
      #    via CLAUDE_CODE_OAUTH_TOKEN. See generate-blog.yml for why this step
      #    tolerates failure and why the token needs verifying after a refresh.
      - name: Generate article with Claude (subscription)
        if: steps.prep.outputs.job_count == '1'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@main
        timeout-minutes: 15
        with:
          prompt_file: blog-work/prompt-0.txt
          claude_args: "--allowedTools Write --model ${{ steps.prep.outputs.model_0 }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # 3) Turn the generated prose into MDX and record the covered CVEs in
      #    .meta.json so tomorrow's run doesn't republish them.
      - name: Finalize article
        id: finalize
        if: steps.prep.outputs.job_count == '1'
        continue-on-error: true
        run: npx tsx bots/generate-blog.ts --security-only --finalize
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 4) Fallback. A security advisory is the one post that must not wait for
      #    a credential to be fixed, so render it from the advisory data instead.
      - name: Fall back to rendered alert
        id: fallback
        if: |
          steps.prep.outputs.job_count == '1' &&
          (steps.finalize.outcome != 'success' ||
           steps.finalize.outputs.written == '0' ||
           steps.finalize.outputs.written == '')
        run: |
          echo "::warning title=Security alert fell back to template::The Claude step produced no article. Run the Verify Claude Token workflow."
          npx tsx bots/generate-blog.ts --security-only --render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push if new alerts
        if: steps.prep.outputs.job_count == '1'
        run: |
          git config user.name "mcppedia-bot"
          git config user.email "bot@mcppedia.org"
          # Regenerate the frontmatter index in the same commit — request-time
          # routes read data/blog-index.json, not content/, so a post committed
          # without it is invisible to /blog, /sitemap.xml and /llms.txt. The
          # previous version of this job omitted this and only generate-blog.yml
          # ever caught the index up.
          node scripts/generate-content-index.mjs
          git add content/blog/ data/blog-index.json
          git diff --cached --quiet && echo "No security alerts to publish" && exit 0
          git commit -m "blog: security alert [bot]"
          # Rebase-retry: other bot workflows push to main too, so a push can be
          # rejected (non-fast-forward) if main moved since checkout. Rebase onto
          # the latest and retry instead of failing the job — the old plain
          # `git push` emailed a spurious failure even when the content was fine.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "Push still failing after 5 attempts"
          exit 1

      - name: Report which path produced the alert
        if: always() && steps.prep.outputs.job_count == '1'
        run: |
          if [ "${{ steps.fallback.outcome }}" = "success" ]; then
            echo "### ⚠️ Security alert published from TEMPLATE, not Claude" >> $GITHUB_STEP_SUMMARY
            echo "Run **Verify Claude Token**." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Security alert published from Claude" >> $GITHUB_STEP_SUMMARY
          fi
