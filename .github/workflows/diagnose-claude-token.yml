name: Diagnose Claude Token

# TEMPORARY. Delete once the CLAUDE_CODE_OAUTH_TOKEN 401 is resolved.
#
# The blog's model step has failed since 2026-06-25 with
# `authentication_error: Invalid bearer token`, surviving two token refreshes.
# Current action versions swallow the error text, so this runs the same token
# two ways to tell the two possible causes apart:
#
#   cli    — the Claude Code CLI directly, newest version, no action wrapper.
#   action — anthropics/claude-code-base-action@main, as the blog workflows use.
#
# If BOTH fail  -> the token/account is the problem (lapsed plan, revoked token).
# If only action fails -> CLI/action version skew; pin the action.
# If BOTH pass  -> the token is fine and the fault is in how the blog job calls it.
#
# Never scheduled, never pushes, never touches content/. It triggers on pushes
# to this diagnostic branch only — workflow_dispatch cannot reach a workflow
# that is not yet on the default branch, and this one is meant to be deleted
# before it ever gets there.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/blog-publishing-automation-f6f28e
    paths:
      - .github/workflows/diagnose-claude-token.yml

permissions:
  contents: read

jobs:
  shape:
    name: Is the stored secret even well-formed?
    runs-on: ubuntu-latest
    steps:
      # Round 1 proved the token is rejected by the newest CLI with no action
      # wrapper and a two-word prompt (401 Invalid bearer token), while the
      # local account it was minted from reports an active Claude Max plan.
      # That combination points at the stored VALUE rather than the account:
      # a truncated paste, a wrapped line, or a stray newline produces a
      # well-formed-looking secret that can never authenticate — and would fail
      # identically across every refresh made the same way.
      #
      # None of the checks below print the secret. Length and a prefix match are
      # derived facts; the runner masks the value itself in any case.
      - name: Inspect the stored secret's shape
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOK}" ]; then
            echo "RESULT: secret is EMPTY or not readable by this workflow"
            exit 0
          fi

          LEN=$(printf '%s' "${TOK}" | wc -c | tr -d ' ')
          echo "length: ${LEN} characters"

          # A `claude setup-token` credential is an oat01 token and runs well
          # past 100 characters. A short value is a truncated copy.
          case "${TOK}" in
            sk-ant-oat01-*) echo "prefix: sk-ant-oat01- (expected for setup-token)" ;;
            sk-ant-api*)    echo "prefix: sk-ant-api - this is an API KEY, not an OAuth token" ;;
            sk-ant-*)       echo "prefix: sk-ant-* but NOT oat01 - wrong credential type" ;;
            *)              echo "prefix: UNRECOGNIZED - not an Anthropic credential" ;;
          esac

          if printf '%s' "${TOK}" | LC_ALL=C grep -qE '[[:space:]]'; then
            echo "whitespace: PRESENT - a newline or space is embedded in the value"
          else
            echo "whitespace: none"
          fi

          # 92 chars with no sk-ant- prefix matches several non-Anthropic
          # credential formats. Identify which, because if this is a live
          # GitHub PAT it has been handed to a third-party action as a bearer
          # token on every run since June and needs revoking, not just replacing.
          case "${TOK}" in
            github_pat_*) echo "identity: GitHub fine-grained PAT — REVOKE IT" ;;
            ghp_*|gho_*|ghu_*|ghs_*|ghr_*) echo "identity: GitHub classic token — REVOKE IT" ;;
            sbp_*)        echo "identity: Supabase access token — revoke it" ;;
            xox*)         echo "identity: Slack token — revoke it" ;;
            eyJ*)         echo "identity: a JWT (Supabase anon/service key?) — revoke it" ;;
            re_*)         echo "identity: Resend API key — revoke it" ;;
            npm_*)        echo "identity: npm token — revoke it" ;;
            *)            echo "identity: unrecognized format" ;;
          esac

          if [ "${LEN}" -lt 80 ]; then
            echo "VERDICT: too short to be a complete setup-token credential - truncated paste"
          else
            echo "VERDICT: length and shape look plausible; the value is rejected server-side"
          fi
