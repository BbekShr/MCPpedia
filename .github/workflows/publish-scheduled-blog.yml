name: Publish Scheduled Blog Post

on:
  schedule:
    # 6:00 AM CST = 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

# Serialize every workflow that pushes to main so their push windows don't
# overlap. Combined with the rebase-retry push below, this eliminates the
# non-fast-forward rejections that emailed spurious "workflow failed" notices.
concurrency:
  group: content-push-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Check for posts scheduled for today
        id: check
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          echo "Today is $TODAY"

          # Find any blog post file matching today's date
          POST=$(ls content/blog/${TODAY}-*.mdx 2>/dev/null | head -1)

          if [ -n "$POST" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "post=$POST" >> $GITHUB_OUTPUT

            # Extract title and hook from frontmatter
            TITLE=$(grep '^title:' "$POST" | head -1 | sed 's/^title: *"//' | sed 's/"$//')
            HOOK=$(grep '^hook:' "$POST" | head -1 | sed 's/^hook: *"//' | sed 's/"$//')
            SLUG=$(basename "$POST" .mdx)

            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "hook=$HOOK" >> $GITHUB_OUTPUT
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No blog post scheduled for today ($TODAY)"
          fi

      - name: Commit post to trigger deployment
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "MCPpedia Bot"
          git config user.email "bot@mcppedia.com"

          # Touch the file to update its timestamp and trigger revalidation
          touch "${{ steps.check.outputs.post }}"
          # data/blog-index.json is the frontmatter index that request-time
          # routes (/sitemap.xml, /llms.txt, /blog) read instead of walking
          # content/ — Cloudflare Workers have no filesystem. Regenerate it in
          # the same commit so the committed copy never lags the posts.
          node scripts/generate-content-index.mjs
          git add "${{ steps.check.outputs.post }}" data/blog-index.json

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit — post was already published"
          else
            git commit -m "Publish: ${{ steps.check.outputs.title }}"
            # Rebase-retry: other bot workflows push to main too, so a push can
            # be rejected (non-fast-forward) if main moved since checkout. Rebase
            # onto the latest and retry instead of failing the job (which sent a
            # spurious failure email even when the publish was otherwise fine).
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase --autostash origin main || true
              if [ "$attempt" = 5 ]; then
                echo "Push still failing after 5 attempts"
                exit 1
              fi
            done
          fi

      - name: Print HN submission link
        if: steps.check.outputs.found == 'true'
        run: |
          TITLE="${{ steps.check.outputs.title }}"
          HOOK="${{ steps.check.outputs.hook }}"
          SLUG="${{ steps.check.outputs.slug }}"
          URL="https://mcppedia.com/blog/${SLUG}"

          # URL-encode for HN submit link
          ENCODED_TITLE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$URL'))")

          HN_LINK="https://news.ycombinator.com/submitlink?u=${ENCODED_URL}&t=${ENCODED_TITLE}"

          echo ""
          echo "========================================"
          echo "POST IS LIVE — Submit to Hacker News:"
          echo "========================================"
          echo ""
          echo "Title:  $TITLE"
          echo "URL:    $URL"
          echo "Hook:   $HOOK"
          echo ""
          echo "HN submit link (one click):"
          echo "$HN_LINK"
          echo ""
          echo "========================================"
