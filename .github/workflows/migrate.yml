name: Migrate Database

# Applies supabase/migrations/** to production.
#
# Deliberately NOT part of the app build. A deploy build is not a
# once-per-merge event: it re-runs on redeploy, on rollback, and can run
# concurrently, and a build that fails halfway would leave DDL half-applied with
# no record of it. This workflow is the single serialised writer instead.
#
# ORDERING: this runs in parallel with the Deploy (Cloudflare Workers) job, not
# before it. For the window between the two, old app code is live against the new
# schema — so migrations must be expand/contract. Add columns/tables in one PR,
# ship the code that reads them in the next, drop the old ones in a third. A
# migration that renames or drops something the currently-deployed code still
# reads will break production for the length of the deploy.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# Never cancel an in-flight migration: a killed `db push` can leave the
# migration history disagreeing with the schema. Queue instead.
concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (dry run)
    # Fork PRs get no secrets, so the dry run would fail on something the
    # contributor cannot fix. Same-repo PRs only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fail with the actual cause. Without this, an unset secret expands to an
      # empty --db-url and the CLI falls back to a local unix socket, so the job
      # dies with "failed to connect to host=/var/run/postgresql user=runner" —
      # which reads as a database outage and is nothing of the kind. The first
      # ever run of this workflow failed exactly that way (PR #117), because the
      # secret was never added when the workflow landed in #110.
      - name: Require SUPABASE_DB_URL
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set on this repository, so no migration can be applied."
            echo "::error::Use the SESSION POOLER string, not the direct connection: Supabase dashboard -> Project Settings -> Database -> Connection string -> Session pooler."
            echo "::error::  postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres"
            echo "::error::The direct host db.<ref>.supabase.co is IPv6-only and GitHub Actions runners are IPv4-only, so it cannot be reached from here."
            echo "::error::Port 5432 (session mode), NOT 6543 (transaction mode) — migrations need session-level state that the transaction pooler does not keep."
            echo "::error::Then: gh secret set SUPABASE_DB_URL --body '<that string>'"
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Show pending migrations
        # --dry-run prints the migrations that WOULD apply and exits without
        # touching the database. This is the review artifact: a human reads it
        # before merging, since merging main is what actually applies them.
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  migrate:
    name: Apply to production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fail with the actual cause. Without this, an unset secret expands to an
      # empty --db-url and the CLI falls back to a local unix socket, so the job
      # dies with "failed to connect to host=/var/run/postgresql user=runner" —
      # which reads as a database outage and is nothing of the kind. The first
      # ever run of this workflow failed exactly that way (PR #117), because the
      # secret was never added when the workflow landed in #110.
      - name: Require SUPABASE_DB_URL
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set on this repository, so no migration can be applied."
            echo "::error::Use the SESSION POOLER string, not the direct connection: Supabase dashboard -> Project Settings -> Database -> Connection string -> Session pooler."
            echo "::error::  postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres"
            echo "::error::The direct host db.<ref>.supabase.co is IPv6-only and GitHub Actions runners are IPv4-only, so it cannot be reached from here."
            echo "::error::Port 5432 (session mode), NOT 6543 (transaction mode) — migrations need session-level state that the transaction pooler does not keep."
            echo "::error::Then: gh secret set SUPABASE_DB_URL --body '<that string>'"
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        # No --include-all: that flag applies out-of-order migrations, which
        # silently reorders DDL against a schema that was built in filename
        # order. If push refuses a migration because an older one landed after
        # it, that is a real conflict to resolve by hand, not to force past.
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
